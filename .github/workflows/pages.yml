# Publishes the privacy policies to
#   https://cear12.github.io/privacy/<app>/privacy_policy.html
# One-time: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r ole-*/ _site/
          {
            echo '<!doctype html><meta charset="utf-8"><title>Privacy policies</title><ul>'
            for d in ole-*/; do
              d="${d%/}"
              echo "<li><a href=\"$d/privacy_policy.html\">$d</a></li>"
            done
            echo '</ul>'
          } > _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
